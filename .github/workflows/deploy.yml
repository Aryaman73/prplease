name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; queue rather than cancel, so a data commit landing
# mid-deploy still ships instead of being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Typecheck the app before shipping it. sync.mjs is excluded by design.
      - run: npx tsc --noEmit

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
