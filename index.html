<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PR, Please — Express Entry draws &amp; PR process tracker</title>
    <meta
      name="description"
      content="An unofficial Express Entry rounds-of-invitations and permanent residence process tracker, built on IRCC's public data."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1c1a16" />
    <!--
      SVG first so the mark stays crisp above 32px; the .ico carries 16 and 32
      for anything that will not take an SVG. Vite rewrites these onto the
      /prplease/ base at build time.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/silkscreen-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/courierprime-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      This tracker renders IRCC data in the browser and needs JavaScript enabled.
      The source data is available at
      <a href="https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/submit-profile/rounds-invitations.html">canada.ca</a>.
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
